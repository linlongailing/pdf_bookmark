# 标题识别规则配置（UTF-8），未出现的配置项使用程序内置默认值

# 只识别带阿拉伯数字 / 中文数字编号的标题（第1章、一、、（一）、1.1、(1) 等）
# 设为 false 时，“前言、总结、参考文献”等特殊标题和无编号的大字号标题也会被识别
numbered_only = true

# 得分阈值：综合得分 >= min_score 判定为标题
min_score = 0.5
# 书签最大层级：更深的标题（如 1.1.1 下面的“1.”“(1)”小列表）不加书签
max_level = 3

# 页眉/页脚区域（占页高比例），落在其中的文本不作为标题
header_zone = 0.06
footer_zone = 0.06
# 在超过该比例页面重复出现的文本（去数字后）视为页眉页脚
repeat_page_ratio = 0.3
# 章节页眉（如每页顶部的“第1章 引言”）：在页面上下该比例区域内、3 页以上重复出现的文本不作为标题
running_zone = 0.15

# 标题长度限制（字符数）
min_chars = 2
max_chars = 60
short_chars = 30

# OCR 结果置信度下限
min_ocr_score = 0.6

# 字号相对正文字号的比值阈值
size_ratio_small = 1.12
size_ratio_large = 1.35

# 各特征权重
w_layout_title = 0.45   # PP-Structure 判为 title
w_number = 0.35         # 普通编号：一、 （一） 1. 1.1 1.1.1 (1)
w_number_strong = 0.5   # 强编号：第X章 / 第X节 / Chapter N / 特殊标题
w_font_small = 0.2      # 字号 >= size_ratio_small
w_font_large = 0.35     # 字号 >= size_ratio_large
w_bold = 0.15           # 粗体（仅文字层）
w_short = 0.1           # 短行且不以句号逗号结尾

# 追加特殊标题（固定为一级，仅 numbered_only = false 时生效）；special_reset = true 可清空内置列表
# special = 编者按
# special = 声明

# 自定义编号规则：pattern = 优先级 | 是否强规则 | 正则（匹配行首，忽略大小写）
# 优先级越小层级越高，内置：篇=0 章=10 节=20 罗马数字=25 一、=30 （一）=40
#                          1.=55 1.1=60 1.1.1=70 1.1.1.1=80 (1)=90
# 匹配前全角字符会转成半角，如 “（” 写成 “\(”
# pattern = 15 | true  | ^第[一二三四五六七八九十0-9]+讲
# pattern = 22 | false | ^Section\s+\d+
# pattern = 35 | false | ^[A-Z]\.\s+\S
